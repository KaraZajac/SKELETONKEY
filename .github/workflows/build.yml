  # kernel-vm-matrix:
  #   strategy:
  #     matrix:
  #       distro: [ubuntu-22.04, debian-11, alma-9, fedora-40]
  #       kernel: [5.10.50, 5.13.0, 5.15.30, 6.1.x, 6.12.x]
  #   runs-on: [self-hosted, kvm-host]
  #   ...
